name: CI

permissions:
  contents: read
  id-token: write

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    name: Go Test
    runs-on: ubuntu-latest
    env:
      GOMODCACHE: ${{ github.workspace }}/.cache/go-mod-cache
      GOCACHE: ${{ github.workspace }}/.cache/go-build-cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.4'

      - name: Prepare Go cache directories
        run: |
          mkdir -p "$GOMODCACHE" "$GOCACHE"
          rm -rf "$GOMODCACHE"/* "$GOCACHE"/*

      - name: Cache Go modules
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.GOCACHE }}
            ${{ env.GOMODCACHE }}
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run go test with coverage (80% threshold)
        run: |
          go test -coverprofile=coverage.out ./.
          COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print substr($3, 1, length($3)-1)}')
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage ($COVERAGE%) is below threshold (80%)"
            exit 1
          fi


      - name: Run go test race
        run: go test -race ./.

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v1.57.0

      - name: Run linter
        run: |
          $(go env GOPATH)/bin/golangci-lint run ./.

