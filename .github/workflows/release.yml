name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: Create GitHub Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create GitHub release
        id: create_release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: |
            Automated release generated for tag `${{ github.ref_name }}`.

            - Commit: `${{ github.sha }}`
            - Ref: `${{ github.ref }}` (tag push)

            ## Notes
            Update this template in `.github/workflows/release.yml` with additional release details as needed.
          draft: false
          prerelease: false

      - name: Output release URL
        run: |
          echo "Release created: ${{ steps.create_release.outputs.url }}"
